<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.SERENIS_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);color:var(--ink)}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.SerenisDesignSystem_452571;
const { ChoiceOption, TextField } = NS;
function App(){const [sel,setSel]=React.useState(1);const [m,setM]=React.useState([0]);const opts=['Mi sento spesso in ansia','Ho difficoltà a dormire','Vorrei capirmi meglio'];
return <div style={{padding:16,display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
<div style={{display:'flex',flexDirection:'column',gap:8}}>{opts.map((o,i)=><ChoiceOption key={i} label={o} selected={sel===i} onClick={()=>setSel(i)}/>)}</div>
<div style={{display:'flex',flexDirection:'column',gap:12}}><TextField label="Come ti chiami?" placeholder="Il tuo nome"/><TextField label="Email" value="giulia@" error="Controlla l'indirizzo email"/>
<div style={{display:'flex',gap:8}}>{['Lavoro','Famiglia'].map((o,i)=><ChoiceOption key={i} multi label={o} selected={m.includes(i)} onClick={()=>setM(x=>x.includes(i)?x.filter(y=>y!==i):[...x,i])}/>)}</div></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
