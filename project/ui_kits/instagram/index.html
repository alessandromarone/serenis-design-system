<!-- @dsCard group="Instagram psicologia" viewport="1100x900" name="Instagram — profilo psicologia" subtitle="serenis.it profile grid + post feed, from reference screenshots" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Serenis Psicologia — Instagram</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.SERENIS_ASSET_BASE='../../';</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--paper-2);font-family:var(--font-body);color:var(--ink)}a{color:var(--violet-600)}a:hover{color:var(--violet-800)}button{font-family:inherit}.noscroll::-webkit-scrollbar{display:none}</style></head><body><div id="root"></div>
<script type="text/babel" src="posts.jsx"></script>
<script type="text/babel" src="Profile.jsx"></script>
<script type="text/babel" src="PostViewer.jsx"></script>
<script type="text/babel">
function App(){
  const [post,setPost]=React.useState(null);
  const feats=['rabbia','appuntamento','arca','frasi-chimica'];
  return <div style={{minHeight:'100vh',display:'flex',gap:56,alignItems:'center',justifyContent:'center',padding:40,boxSizing:'border-box',flexWrap:'wrap'}}>
    <div style={igS.phone}><div style={igS.status}>10:25</div>{post?<FeedScreen key={post.id} start={post} onBack={()=>setPost(null)}/>:<ProfileScreen onOpen={setPost}/>}</div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(2,auto)',gap:14}}>{feats.map(id=><button key={id} onClick={()=>setPost(POSTS.find(p=>p.id===id))} style={{border:0,padding:0,cursor:'pointer',borderRadius:6,overflow:'hidden',boxShadow:'var(--shadow-soft)'}}><PostSlide post={POSTS.find(p=>p.id===id)} scale={0.24}/></button>)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
